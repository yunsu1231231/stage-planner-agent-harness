<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공연 관람 플래너 — 실행 로그</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>🎭 공연 관람 <span>플래너</span></h1>
    <nav>
      <a href="index.html">대화</a>
      <a href="plans.html">계획 관리</a>
      <a href="logs.html" class="active">실행 로그</a>

    <span class="api muted" id="api-base"></span>
  </header>
  <main>
    <div id="banner"></div>
    <div class="logs-layout">
      <section>

        <div id="sessions"></div>

      </section>
      <section class="panel">
        <h2 id="detail-title">세션을 선택하세요</h2>
        <div id="detail"></div>
      </section>
    </div>
  </main>
  <script type="module" src="js/logs.js"></script>

</html>
